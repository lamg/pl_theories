extra_css = ["styles/reading.css"]
extra_js = ["styles/const-kinds.js"]
landing_page = "PlTheories"
# Reading order for every level of the index, as full module names.
order = [
  "PlTheories.FunZero",
  "PlTheories.FunZero.Syntax",
  "PlTheories.FunZero.Typechecking",
  "PlTheories.FunZero.Syntax.Parsing",
  "PlTheories.FunZero.Syntax.Language",
  "PlTheories.FunZero.Syntax.RecursiveDescent",
  "PlTheories.FunZero.Typechecking.BasicConcepts",
  "PlTheories.FunZero.Typechecking.Unification",
  "PlTheories.FunZero.Typechecking.AlgorithmW",
]
docstrings_as_text = true
hide_commands = ["import", "open", "namespace", "end", "set_option", "example"]
# Helpers for `Language` (tokens, identifier, token parsers) live
# in `Helpers`, and the Recursive Descent correctness proofs live in
# `RecursiveDescentProofs`, so those pages can show only the definitions.
# Both modules are still built and imported; they just get no page.
exclude = ["PlTheories.FunZero.Syntax.Helpers", "PlTheories.FunZero.Syntax.RecursiveDescentProofs"]

[[targets]]
library = "PlTheories"

[metadata]
title = "Programming Language Theories"
description = "Building a small programming language in Lean, from specifications to implementations and proofs."

[modules."PlTheories"]
title = "Programming Language Theories"

[modules."PlTheories.FunZero.Syntax.Parsing"]
title = "Parser specifications"

[modules."PlTheories.FunZero"]
title = "A small functional language"

