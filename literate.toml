title = "Syntax"

[modules."PlTheories.FunZero.Syntax.Language"]
title = "Language syntax"

[modules."PlTheories.FunZero.Syntax.RecursiveDescent"]
title = "Recursive descent"

[modules."PlTheories.FunZero.Typechecking"]
title = "Typechecking"

